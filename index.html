<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ten Master HAYATE</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1f2430; --muted: #6b7280;
    --line: #d5d9e0; --accent: #2563eb; --accent-text: #ffffff;
    --ok: #15803d; --ng: #dc2626; --disp: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b; --card: #1e222a; --text: #e8eaee; --muted: #9aa3b2;
      --line: #394050; --accent: #5b8cff; --accent-text: #0b1020;
      --ok: #4ade80; --ng: #f87171; --disp: #14161b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font-family: "Meiryo", "Hiragino Sans", system-ui, sans-serif;
  }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 12px; text-align: center; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 1rem; padding: 10px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 700; }
  .levels label { margin: 0 6px; cursor: pointer; }
  #timer { font-family: Consolas, "Courier New", monospace; font-size: 1.8rem; min-width: 8.5ch; text-align: right; }
  .digit { text-align: center; }
  .digit .box {
    width: 64px; height: 72px; line-height: 72px; font-size: 2.2rem; font-weight: 700;
    border: 2px solid var(--line); border-radius: 8px; background: var(--disp); margin-bottom: 6px;
  }
  .digit button { width: 64px; padding: 6px 0; font-size: .85rem; }
  .ops button { width: 60px; font-size: 1.5rem; padding: 6px 0; }
  .label { font-size: .8rem; color: var(--muted); text-align: center; margin-bottom: 4px; }
  #display {
    min-height: 56px; font-size: 1.7rem; text-align: right; padding: 8px 12px;
    border: 2px solid var(--line); border-radius: 8px; background: var(--disp);
    overflow-x: auto; white-space: nowrap;
  }
  #result { text-align: center; font-size: 1.8rem; font-weight: 700; min-height: 2.4rem; margin-top: 10px; }
  #recordNote { text-align: center; font-size: .85rem; color: var(--muted); min-height: 1.2rem; }
  h2 { font-size: 1rem; margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th, td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  td.num { font-family: Consolas, monospace; text-align: right; }
  .small { font-size: .85rem; padding: 6px 10px; }

.logo-wrap{
  text-align:center;
  margin-bottom:16px;
}

.logo{
  width:100%;
  max-width:480px;
  height:auto;
  display:block;
  margin:auto;
}

</style>
</head>
<body>
<main>

  <div class="logo-wrap">
  <img src="logo.png" alt="Ten Master HAYATE" class="logo">
  </div>

  <div class="card">
    <div class="row levels" role="radiogroup" aria-label="難易度">
      <span>難易度:</span>
      <label><input type="radio" name="level" value="かんたん"> かんたん</label>
      <label><input type="radio" name="level" value="ふつう" checked> ふつう</label>
      <label><input type="radio" name="level" value="むずかしい"> むずかしい</label>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="startBtn">スタート</button>
      <button id="stopBtn">ストップ</button>
      <span id="timer" aria-live="off">0.000 秒</span>
    </div>
  </div>

  <div class="card">
    <div class="row" id="digits"></div>
    <div class="row ops" id="ops" style="margin-top:14px">
      <button data-op="+" aria-label="足す">＋</button>
      <button data-op="-" aria-label="引く">－</button>
      <button data-op="*" aria-label="掛ける">×</button>
      <button data-op="/" aria-label="割る">÷</button>
    </div>
  </div>

  <div class="card">
    <div class="label">計算枠</div>
    <div id="display"></div>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="calcBtn">計算</button>
      <button id="undoBtn">1つ戻す</button>
      <button id="clearBtn">クリア</button>
    </div>
    <div id="result" aria-live="polite"></div>
    <div id="recordNote"></div>
  </div>

  <div class="card">
    <h2>正解の記録</h2>
    <div id="history"></div>
    <div class="row" style="margin-top:10px">
      <button class="small" id="csvBtn">CSVでダウンロード</button>
      <button class="small" id="delBtn">記録を全部消す</button>
    </div>
    <p class="label" style="margin:8px 0 0">記録はこのブラウザの中だけに保存されます。</p>
  </div>
</main>

<script>
"use strict";

// ---------- 計算（分数で正確に） ----------
const gcd = (a, b) => (b === 0 ? Math.abs(a) : gcd(b, a % b));
function frac(n, d) {
  if (d < 0) { n = -n; d = -d; }
  const g = gcd(n, d) || 1;
  return [n / g, d / g];
}
// tokens: [数, 記号, 数, 記号, ...]。左から順に計算。0で割ると null を返す
function calcLeftToRight(tokens) {
  let r = frac(Number(tokens[0]), 1);
  for (let i = 1; i < tokens.length; i += 2) {
    const op = tokens[i], n = Number(tokens[i + 1]);
    if (op === "+") r = frac(r[0] + n * r[1], r[1]);
    else if (op === "-") r = frac(r[0] - n * r[1], r[1]);
    else if (op === "*") r = frac(r[0] * n, r[1]);
    else if (op === "/") { if (n === 0) return null; r = frac(r[0], r[1] * n); }
  }
  return r;
}
const isTen = (r) => r !== null && r[0] === 10 && r[1] === 1;

// ---------- 出題 ----------
function permutations(arr) {
  const seen = new Set(), out = [];
  (function rec(cur, rest) {
    if (!rest.length) { const k = cur.join(","); if (!seen.has(k)) { seen.add(k); out.push(cur); } return; }
    rest.forEach((v, i) => rec([...cur, v], [...rest.slice(0, i), ...rest.slice(i + 1)]));
  })([], arr);
  return out;
}
const OP_LIST = ["+", "-", "*", "/"];
function countSolutions(digits) {
  let n = 0;
  for (const p of permutations(digits))
    for (const a of OP_LIST) for (const b of OP_LIST) for (const c of OP_LIST)
      if (isTen(calcLeftToRight([p[0], a, p[1], b, p[2], c, p[3]]))) n++;
  return n;
}
// 難易度 = 10になる式の数。多いほど簡単
const LEVELS = {
  "かんたん": (n) => n >= 30,
  "ふつう": (n) => n >= 4 && n <= 29,
  "むずかしい": (n) => n >= 1 && n <= 3,
};
function makeProblem(level) {
  const ok = LEVELS[level];
  for (;;) {
    const d = Array.from({ length: 4 }, () => Math.floor(Math.random() * 10));
    if (ok(countSolutions(d))) return d;
  }
}

// ---------- 記録（localStorage） ----------
const KEY = "make10.records";
function loadRecords() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
}
function saveRecords(list) {
  try { localStorage.setItem(KEY, JSON.stringify(list)); return true; } catch (e) { return false; }
}
const pad = (n) => String(n).padStart(2, "0");
const fmtDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- 画面 ----------
const $ = (id) => document.getElementById(id);
const SYM = { "+": "＋", "-": "－", "*": "×", "/": "÷" };
const state = { digits: [], tokens: [], order: [], running: false, started: false, t0: 0, raf: 0, level: "ふつう" };

const digitBoxes = [], digitBtns = [];
for (let i = 0; i < 4; i++) {
  const col = document.createElement("div");
  col.className = "digit";
  col.innerHTML = `<div class="box" aria-label="数字${i + 1}"></div><button disabled>入力</button>`;
  $("digits").appendChild(col);
  digitBoxes.push(col.querySelector(".box"));
  const b = col.querySelector("button");
  b.addEventListener("click", () => addNumber(i));
  digitBtns.push(b);
}

function render() {
  $("display").textContent = state.tokens.map((t) => SYM[t] || t).join(" ");
}
function setDigitButtons() {
  digitBtns.forEach((b, i) => {
    b.disabled = !(state.running && !state.order.includes(i));
  });
}
function showTime(ms) { $("timer").textContent = (ms / 1000).toFixed(3) + " 秒"; }
function tick() {
  if (!state.running) return;
  showTime(performance.now() - state.t0);
  state.raf = requestAnimationFrame(tick);
}
function stopTimer() {
  if (!state.running) return null;
  const ms = performance.now() - state.t0;
  state.running = false;
  cancelAnimationFrame(state.raf);
  showTime(ms);
  return ms;
}

function start() {
  state.level = document.querySelector('input[name="level"]:checked').value;
  $("startBtn").disabled = true;
  setTimeout(() => {
    state.digits = makeProblem(state.level);
    digitBoxes.forEach((b, i) => (b.textContent = state.digits[i]));
    state.started = true;
    state.running = true;
    clearInput();
    cancelAnimationFrame(state.raf);
    state.t0 = performance.now();
    tick();
    $("startBtn").disabled = false;
  }, 0);
}
function stop() {
  if (stopTimer() === null) return;
  setDigitButtons();
  setResult("ストップ", "var(--muted)");
}
function clearInput() {
  state.tokens = []; state.order = [];
  setResult("", "");
  $("recordNote").textContent = "";
  render(); setDigitButtons();
}
function setResult(text, color) {
  const r = $("result"); r.textContent = text; r.style.color = color;
}
const expectNumber = () => state.tokens.length % 2 === 0;

function addNumber(i) {
  if (!state.running || state.order.includes(i) || !expectNumber()) return;
  state.tokens.push(String(state.digits[i]));
  state.order.push(i);
  render(); setDigitButtons();
}
function addOp(op) {
  if (!state.running || expectNumber() || state.tokens.length >= 7) return;
  state.tokens.push(op);
  render();
}
function undo() {
  if (!state.running || !state.tokens.length) return;
  const wasNumber = state.tokens.length % 2 === 1;
  state.tokens.pop();
  if (wasNumber) state.order.pop();
  setResult("", "");
  render(); setDigitButtons();
}
function calculate() {
  if (!state.running) return;
  if (state.tokens.length !== 7) { alert("4つの数字と3つの記号を入力してください"); return; }
  const r = calcLeftToRight(state.tokens);
  if (r === null) { setResult("0では割れません", "var(--muted)"); return; }
  if (isTen(r)) {
    const when = new Date();
    const ms = stopTimer();
    setDigitButtons();
    setResult("正解！", "var(--ok)");
    const rec = {
      when: fmtDate(when), seconds: (ms / 1000).toFixed(3), level: state.level,
      digits: state.digits.join(" "),
      expr: state.tokens.map((t) => SYM[t] || t).join(""),
    };
    const list = loadRecords(); list.push(rec);
    const saved = saveRecords(list);
    $("recordNote").textContent =
      `${when.getFullYear()}年${when.getMonth() + 1}月${when.getDate()}日 ${pad(when.getHours())}:${pad(when.getMinutes())}:${pad(when.getSeconds())}　${rec.seconds}秒` +
      (saved ? "（記録しました）" : "（記録に失敗しました）");
    renderHistory();
  } else {
    setResult("残念", "var(--ng)");
  }
}

// ---------- 記録の表示・CSV ----------
function renderHistory() {
  const list = loadRecords();
  if (!list.length) { $("history").innerHTML = '<p class="label">まだ記録はありません</p>'; return; }
  const rows = list.slice(-20).reverse().map((r) =>
    `<tr><td>${esc(r.when)}</td><td class="num">${esc(r.seconds)}</td><td>${esc(r.level)}</td><td>${esc(r.expr)}</td></tr>`).join("");
  $("history").innerHTML =
    `<table><thead><tr><th>日時</th><th>秒</th><th>難易度</th><th>式</th></tr></thead><tbody>${rows}</tbody></table>` +
    (list.length > 20 ? `<p class="label">新しい20件を表示（全${list.length}件）</p>` : "");
}
function downloadCsv() {
  const list = loadRecords();
  if (!list.length) { alert("記録がありません"); return; }
  const q = (s) => `"${String(s).replace(/"/g, '""')}"`;
  const lines = [["正解日時", "タイム(秒)", "難易度", "数字", "式"].map(q).join(",")]
    .concat(list.map((r) => [r.when, r.seconds, r.level, r.digits, r.expr].map(q).join(",")));
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "records.csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function deleteRecords() {
  if (!loadRecords().length) return;
  if (confirm("記録を全部消します。元に戻せません。よろしいですか？")) {
    try { localStorage.removeItem(KEY); } catch (e) {}
    renderHistory();
  }
}

// ---------- イベント ----------
$("startBtn").addEventListener("click", start);
$("stopBtn").addEventListener("click", stop);
$("calcBtn").addEventListener("click", calculate);
$("undoBtn").addEventListener("click", undo);
$("clearBtn").addEventListener("click", clearInput);
$("csvBtn").addEventListener("click", downloadCsv);
$("delBtn").addEventListener("click", deleteRecords);
document.querySelectorAll("#ops button").forEach((b) => b.addEventListener("click", () => addOp(b.dataset.op)));
renderHistory();
</script>
</body>
</html>
